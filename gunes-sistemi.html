<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güneş Sistemi Keşfi - Orion's Aerospace</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .back-btn {
            position: fixed;
            top: 30px;
            left: 30px;
            background: rgba(0, 240, 255, 0.1);
            border: 2px solid #00f0ff;
            color: #00f0ff;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            z-index: 1000;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            transform: translateX(-5px);
        }

        .page-title {
            text-align: center;
            padding: 30px 20px 20px;
            font-size: 36px;
            color: #00f0ff;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.8);
            letter-spacing: 3px;
            position: relative;
            z-index: 1;
        }

        /* Tek Güneş Sistemi Modülü */
        .solar-system-module {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 60px;
            padding: 40px 40px 60px;
            position: relative;
            z-index: 1;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Her Gök Cismi Kartı */
        .celestial-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .celestial-body:hover {
            transform: translateY(-15px) scale(1.1);
        }

        /* Hologram Küre */
        .hologram-sphere {
            position: relative;
            border-radius: 50%;
            transform-style: preserve-3d;
            animation: rotateSphere 12s linear infinite;
        }

        @keyframes rotateSphere {
            from { transform: rotateY(0deg) rotateX(15deg); }
            to { transform: rotateY(360deg) rotateX(15deg); }
        }

        /* Sık Çizgiler - Enlem */
        .lat-line {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 1px solid currentColor;
            border-radius: 50%;
            opacity: 0.7;
            top: 0;
            left: 0;
        }

        .lat-line:nth-child(1) { transform: rotateX(0deg); }
        .lat-line:nth-child(2) { transform: rotateX(15deg); }
        .lat-line:nth-child(3) { transform: rotateX(30deg); }
        .lat-line:nth-child(4) { transform: rotateX(45deg); }
        .lat-line:nth-child(5) { transform: rotateX(60deg); }
        .lat-line:nth-child(6) { transform: rotateX(75deg); }
        .lat-line:nth-child(7) { transform: rotateX(90deg); }
        .lat-line:nth-child(8) { transform: rotateX(105deg); }
        .lat-line:nth-child(9) { transform: rotateX(120deg); }
        .lat-line:nth-child(10) { transform: rotateX(135deg); }
        .lat-line:nth-child(11) { transform: rotateX(150deg); }
        .lat-line:nth-child(12) { transform: rotateX(165deg); }

        /* Sık Çizgiler - Boylam */
        .lon-line {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 1px solid currentColor;
            border-radius: 50%;
            opacity: 0.7;
            top: 0;
            left: 0;
        }

        .lon-line:nth-child(13) { transform: rotateY(0deg); }
        .lon-line:nth-child(14) { transform: rotateY(15deg); }
        .lon-line:nth-child(15) { transform: rotateY(30deg); }
        .lon-line:nth-child(16) { transform: rotateY(45deg); }
        .lon-line:nth-child(17) { transform: rotateY(60deg); }
        .lon-line:nth-child(18) { transform: rotateY(75deg); }
        .lon-line:nth-child(19) { transform: rotateY(90deg); }
        .lon-line:nth-child(20) { transform: rotateY(105deg); }
        .lon-line:nth-child(21) { transform: rotateY(120deg); }
        .lon-line:nth-child(22) { transform: rotateY(135deg); }
        .lon-line:nth-child(23) { transform: rotateY(150deg); }
        .lon-line:nth-child(24) { transform: rotateY(165deg); }

        /* Güneş */
        .sun-sphere {
            width: 140px;
            height: 140px;
            color: #ff8c00;
            box-shadow: 0 0 60px rgba(255, 140, 0, 0.9), inset 0 0 50px rgba(255, 140, 0, 0.5);
            animation-duration: 25s;
        }

        .sun-sphere .lat-line,
        .sun-sphere .lon-line {
            border-color: #ff8c00;
            box-shadow: 0 0 8px rgba(255, 140, 0, 0.6);
        }

        /* Merkür */
        .mercury-sphere {
            width: 50px;
            height: 50px;
            color: #8b8b8b;
            box-shadow: 0 0 30px rgba(139, 139, 139, 0.7);
        }

        /* Venüs */
        .venus-sphere {
            width: 65px;
            height: 65px;
            color: #daa520;
            box-shadow: 0 0 35px rgba(218, 165, 32, 0.7);
        }

        /* Dünya */
        .earth-sphere {
            width: 68px;
            height: 68px;
            color: #00f0ff;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.8);
        }

        /* Mars */
        .mars-sphere {
            width: 55px;
            height: 55px;
            color: #ff4500;
            box-shadow: 0 0 35px rgba(255, 69, 0, 0.7);
        }

        /* Jüpiter */
        .jupiter-sphere {
            width: 110px;
            height: 110px;
            color: #daa520;
            box-shadow: 0 0 50px rgba(218, 165, 32, 0.8);
        }

        /* Satürn */
        .saturn-sphere {
            width: 95px;
            height: 95px;
            color: #ffd700;
            box-shadow: 0 0 45px rgba(255, 215, 0, 0.8);
            position: relative;
        }

        .saturn-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150px;
            height: 40px;
            border: 3px solid rgba(255, 215, 0, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%) rotateX(75deg);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            pointer-events: none;
        }

        /* Uranüs */
        .uranus-sphere {
            width: 80px;
            height: 80px;
            color: #40e0d0;
            box-shadow: 0 0 40px rgba(64, 224, 208, 0.7);
        }

        /* Neptün */
        .neptune-sphere {
            width: 78px;
            height: 78px;
            color: #4169e1;
            box-shadow: 0 0 40px rgba(65, 105, 225, 0.7);
        }

        /* İsim Etiketi */
        .body-name {
            margin-top: 20px;
            font-size: 14px;
            font-weight: bold;
            color: #00f0ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
            text-align: center;
        }

        /* Bilgi Popup */
        .info-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(10, 14, 23, 0.98);
            backdrop-filter: blur(20px);
            border: 2px solid #00f0ff;
            border-radius: 15px;
            padding: 35px;
            max-width: 550px;
            width: 90%;
            box-shadow: 0 0 60px rgba(0, 240, 255, 0.6), 0 0 120px rgba(0, 240, 255, 0.3);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            z-index: 1000;
        }

        .info-popup.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .info-popup h2 {
            color: #00f0ff;
            margin-bottom: 20px;
            font-size: 30px;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
            border-bottom: 2px solid rgba(0, 240, 255, 0.3);
            padding-bottom: 10px;
        }

        .info-popup p {
            color: #d1d5db;
            line-height: 1.9;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .info-popup strong {
            color: #00f0ff;
        }

        .info-popup .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: #ff4500;
            font-size: 36px;
            cursor: pointer;
            transition: all 0.3s;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .info-popup .close-btn:hover {
            background: rgba(255, 69, 0, 0.2);
            color: #ff0000;
            transform: rotate(90deg);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 999;
        }

        .overlay.show {
            opacity: 1;
            visibility: visible;
        }

        /* Responsive */
        @media (max-width: 1400px) {
            .solar-system-module {
                gap: 40px;
                padding: 30px 20px 50px;
            }
        }

        @media (max-width: 1024px) {

            .jupiter-sphere { width: 85px; height: 85px; }
            .saturn-sphere { width: 75px; height: 75px; }
            .uranus-sphere { width: 65px; height: 65px; }
            .neptune-sphere { width: 62px; height: 62px; }
            .earth-sphere { width: 55px; height: 55px; }
            .venus-sphere { width: 52px; height: 52px; }
            .mars-sphere { width: 45px; height: 45px; }
            .mercury-sphere { width: 40px; height: 40px; }
        }

        @media (max-width: 768px) {
            .page-title { font-size: 26px; }
            .solar-system-module {
                gap: 30px;
                padding: 20px 15px 40px;
            }
            .sun-sphere { width: 90px; height: 90px; }
            .jupiter-sphere { width: 70px; height: 70px; }
            .saturn-sphere { width: 60px; height: 60px; }
            .uranus-sphere { width: 50px; height: 50px; }
            .neptune-sphere { width: 48px; height: 48px; }
            .earth-sphere { width: 42px; height: 42px; }
            .venus-sphere { width: 40px; height: 40px; }
            .mars-sphere { width: 35px; height: 35px; }
            .mercury-sphere { width: 32px; height: 32px; }
            .body-name { font-size: 12px; }
        }
    </style>
</head>

        function showInfo(planetKey) {
            const popup = document.getElementById('infoPopup');
            const overlay = document.getElementById('overlay');
            const title = document.getElementById('popupTitle');
            const content = document.getElementById('popupContent');
            
            const data = planetData[planetKey];
            if (data) {
                title.innerHTML = data.title;
                content.innerHTML = data.content;
                popup.classList.add('show');
                overlay.classList.add('show');
            }
        }

        function closeInfo() {
            document.getElementById('infoPopup').classList.remove('show');
            document.getElementById('overlay').classList.remove('show');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeInfo();
        });
    </script>
